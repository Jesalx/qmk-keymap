version: "3"

vars:
  KEYBOARD: zsa/voyager
  KEYMAP: jesal
  KEYMAP_C: keyboards/zsa/voyager/keymaps/jesal/keymap.c
  C_SOURCES: jesal.c {{.KEYMAP_C}} keyboards/zsa/voyager/keymaps/jesal/config.h
  KEYMAP_JSON: zsa_voyager_jesal.json
  KEYMAP_SVG: keymap.svg
  # Must match the order of `enum layers` in jesal.c.
  LAYER_NAMES: BASE NAV SYMBOLS NUMPAD

tasks:
  json:
    desc: Regenerate the keymap JSON (for config.qmk.fm) from keymap.c
    cmds:
      - qmk c2json -kb {{.KEYBOARD}} -km {{.KEYMAP}} --no-cpp -o {{.KEYMAP_JSON}} {{.KEYMAP_C}}
      # qmk c2json backs up the previous output whenever it changes.
      - rm -f {{.KEYMAP_JSON}}.bak

  draw:
    desc: Regenerate the layout image for the README from the keymap JSON
    deps: [json]
    cmds:
      # Use keymap-drawer from PATH when present (CI), else fetch it via nix.
      - |
        draw='keymap parse -q {{.KEYMAP_JSON}} -l {{.LAYER_NAMES}} | keymap draw -k {{.KEYBOARD}} - -o {{.KEYMAP_SVG}}'
        if command -v keymap >/dev/null; then
          sh -c "$draw"
        else
          nix-shell -p keymap-drawer --run "$draw"
        fi

  leader:
    desc: Regenerate the leader sequence table in the README from super_leader.def
    cmds:
      - sh tools/leader_table.sh keyboards/zsa/voyager/keymaps/jesal/super_leader.def README.md

  lint:
    desc: Lint the GitHub Actions workflows (same check as CI)
    cmds:
      - actionlint

  qmk-lint:
    desc: Lint the keymap with qmk lint (same check as CI)
    cmds:
      - qmk lint -kb {{.KEYBOARD}} -km {{.KEYMAP}}

  format:
    desc: Format the keymap C sources with clang-format
    cmds:
      - nix-shell -p clang-tools --run 'qmk format-c {{.C_SOURCES}}'

  format-check:
    desc: Fail if the keymap C sources are not clang-formatted (same check as CI)
    cmds:
      # Use clang-format from PATH when present (CI), else fetch it via nix.
      - |
        check='qmk format-c -n {{.C_SOURCES}}'
        if command -v clang-format >/dev/null; then
          sh -c "$check"
        else
          nix-shell -p clang-tools --run "$check"
        fi

  check:
    desc: Run every CI check locally
    cmds:
      - task: lint
      - task: qmk-lint
      - task: format-check

  flash:
    desc: Compile and flash the keymap (put the keyboard in bootloader mode when prompted)
    cmds:
      - nix-shell -p dfu-util --run 'qmk flash -kb {{.KEYBOARD}} -km {{.KEYMAP}}'

  default:
    desc: Regenerate all generated files
    cmds:
      - task: draw
      - task: leader
