---
name: build

on:
  push:
    paths:
      - .github/workflows/build.yaml
      - qmk.json
      - keyboards/**
      - modules/**
      - "*.c"
      - "*.h"
      - zsa_voyager_jesal.json
      - keymap.svg
      - README.md
      - tools/**
      - Taskfile.yml
      - flake.nix
      - flake.lock
      - .clang-format
  pull_request:
    paths:
      - .github/workflows/build.yaml
      - qmk.json
      - keyboards/**
      - modules/**
      - "*.c"
      - "*.h"
      - zsa_voyager_jesal.json
      - keymap.svg
      - README.md
      - tools/**
      - Taskfile.yml
      - flake.nix
      - flake.lock
      - .clang-format
  workflow_dispatch:

# A newer push to the same ref supersedes any run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main, so a release can't be cut off half way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The reusable workflow declares contents: write, and a caller must grant at
# least what it requests or the run fails at startup.
permissions:
  contents: write

jobs:
  # The qmk_firmware commit comes from flake.lock, so `nix flake update` (and
  # the update workflow) is the only place it is bumped.
  pins:
    name: pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      qmk_ref: ${{ steps.qmk.outputs.ref }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Read qmk_firmware pin
        id: qmk
        run: |
          echo "ref=$(jq -er '.nodes.qmk_firmware.locked.rev' flake.lock)" >> "$GITHUB_OUTPUT"

  build:
    name: qmk userspace build
    needs: pins
    # Pinned to a commit (qmk/.github main as of 2026-11-27); bump by hand.
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@01daf5113fa50804558f21cc074ab99ba84ddeaf
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: ${{ needs.pins.outputs.qmk_ref }}

  flake:
    name: flake
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Check flake
        run: nix flake check

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Lint workflows
        run: task lint

  generated:
    name: generated files
    needs: pins
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Every run step executes inside the flake's dev shell.
    defaults:
      run:
        shell: nix develop --command bash -e {0}
    steps:
      - name: Checkout userspace
        uses: actions/checkout@v7
      # The ref is a commit, so the checkout can be cached by that commit.
      - name: Cache qmk_firmware
        id: qmk-cache
        uses: actions/cache@v6
        with:
          path: qmk_firmware
          key: qmk_firmware-${{ needs.pins.outputs.qmk_ref }}
      - name: Checkout qmk_firmware
        if: steps.qmk-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: qmk/qmk_firmware
          ref: ${{ needs.pins.outputs.qmk_ref }}
          path: qmk_firmware
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v23
      - name: Cache Nix store
        uses: DeterminateSystems/magic-nix-cache-action@v15
      - name: Configure qmk
        run: |
          qmk config user.qmk_home="$PWD/qmk_firmware"
          qmk config user.overlay_dir="$PWD"
      - name: Lint keymap
        run: task qmk-lint
      - name: Check C formatting
        run: task format-check
      - name: Regenerate keymap JSON and SVG
        run: task
      - name: Fail if generated files are stale
        run: git diff --exit-code -- zsa_voyager_jesal.json keymap.svg README.md

  release:
    name: release
    needs: [build, generated]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only firmware inputs warrant a release; README, SVG, tooling and CI
      # changes do not alter the binary.
      - name: Detect firmware changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- qmk.json keyboards modules '*.c' '*.h')
          if [ -n "$files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download firmware
        if: steps.changes.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: Firmware
          path: firmware
      - name: Create release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          gh release create "$tag" firmware/*.bin --target "$GITHUB_SHA" --generate-notes
