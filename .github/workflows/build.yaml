---
name: build

on:
  push:
    paths:
      - .github/workflows/build.yaml
      - qmk.json
      - keyboards/**
      - modules/**
      - "*.c"
      - "*.h"
      - zsa_voyager_jesal.json
      - keymap.svg
      - README.md
      - tools/**
      - Taskfile.yml
  pull_request:
    paths:
      - .github/workflows/build.yaml
      - qmk.json
      - keyboards/**
      - modules/**
      - "*.c"
      - "*.h"
      - zsa_voyager_jesal.json
      - keymap.svg
      - README.md
      - tools/**
      - Taskfile.yml
  workflow_dispatch:

# A newer push to the same ref supersedes any run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main, so a release can't be cut off half way.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# The reusable workflow declares contents: write, and a caller must grant at
# least what it requests or the run fails at startup.
permissions:
  contents: write

jobs:
  build:
    name: qmk userspace build
    uses: qmk/.github/.github/workflows/qmk_userspace_build.yml@main
    with:
      qmk_repo: qmk/qmk_firmware
      qmk_ref: master

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Lint workflows
        run: |
          docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  generated:
    name: generated files
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout userspace
        uses: actions/checkout@v7
      - name: Checkout qmk_firmware
        uses: actions/checkout@v7
        with:
          repository: qmk/qmk_firmware
          ref: master
          path: qmk_firmware
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .github/workflows/build.yaml
      - name: Install tools
        run: |
          pip install qmk keymap-drawer==0.23.0 go-task-bin clang-format
          qmk config user.qmk_home="$PWD/qmk_firmware"
          qmk config user.overlay_dir="$PWD"
      - name: Lint keymap
        run: task qmk-lint
      - name: Check C formatting
        run: task format-check
      - name: Regenerate keymap JSON and SVG
        run: task
      - name: Fail if generated files are stale
        run: git diff --exit-code -- zsa_voyager_jesal.json keymap.svg README.md

  release:
    name: release
    needs: [build, generated]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Only firmware inputs warrant a release; README, SVG, tooling and CI
      # changes do not alter the binary.
      - name: Detect firmware changes
        id: changes
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          files=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- qmk.json keyboards modules '*.c' '*.h')
          if [ -n "$files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download firmware
        if: steps.changes.outputs.changed == 'true'
        uses: actions/download-artifact@v8
        with:
          name: Firmware
          path: firmware
      - name: Create release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          gh release create "$tag" firmware/*.bin --target "$GITHUB_SHA" --generate-notes
